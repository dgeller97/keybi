[package]
name = "keybi"
description = "A Rust business intelligence tool for modeling data and building interactive reports in a browser"
version = "0.1.0"
edition = "2024"
default-run = "keybi"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
chrono = { version = "0.4", default-features = false }
datafusion = { version = "49", default-features = false }
parquet = { version = "55", default-features = false, features = ["arrow", "snap", "flate2", "lz4", "zstd"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "limit"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "native-tls", "winauth"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
sha2 = "0.11"
tempfile = "3"
calamine = { version = "0.38.0", default-features = false, features = ["chrono"] }
zip = { version = "9.7", default-features = false }
quick-xml = "0.42"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = 2
strip = true
