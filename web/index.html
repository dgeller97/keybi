<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#202929" />
    <title>KeyBI</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23212c29'/%3E%3Cpath d='M9 28V12h6v16zm9 0V7h6v21zm9 0V17h6v11z' fill='%23edde93'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/studio.css" />
    <link rel="stylesheet" href="/portfolio.css" />
  </head>
  <body>
    <header>
      <button class="brand" data-action="home" aria-label="Workspace home">
        <span class="brandmark"><i></i><i></i><i></i></span>Key<b>BI</b>
      </button>
      <span class="head-divider"></span
      ><button id="report-name" title="Rename report"></button
      ><span id="save-state"></span>
      <div class="author-history" role="group" aria-label="Edit history">
        <button data-action="undo" data-icon="undo" aria-label="Undo" title="Undo (Ctrl+Z)" disabled></button>
        <button data-action="redo" data-icon="redo" aria-label="Redo" title="Redo (Ctrl+Y)" disabled></button>
      </div>
      <div class="author-clipboard" role="group" aria-label="Visual clipboard">
        <button data-action="copy-visuals" data-icon="copy" aria-label="Copy visuals" title="Copy selected visuals (Ctrl+C)" disabled></button>
        <button data-action="paste-visuals" data-icon="paste" aria-label="Paste visuals" title="Paste visuals on this page (Ctrl+V)" disabled></button>
      </div>
      <div class="spacer"></div>
      <button data-action="toggle-reading" class="view-toggle">Reading view</button>
      <button data-action="library" class="header-tool" data-icon="library">
        Library</button
      ><button data-action="save" class="save" data-icon="save">
        Save report
      </button>
    </header>
    <nav class="ribbon" aria-label="Authoring tools">
      <div class="ribbon-group">
        <button data-action="import" data-icon="import">Get data</button
        ><button data-action="prepare" data-icon="table">Transform CSV</button
        ><button data-action="sqlserver" data-icon="database">SQL Server</button
        ><button data-action="relationship" data-icon="model">
          Relationship
        </button>
      </div>
      <div class="ribbon-group">
        <button data-action="measure" data-icon="measure">New measure</button
        ><button data-action="new-parameter" data-icon="parameterSlicer">Field parameter</button
        ><button data-action="calculation" data-icon="calc">
          Calculated column
        </button>
      </div>
      <div class="ribbon-group">
        <button data-action="add" data-icon="plusbox">Add visual</button
        ><button data-action="filter" data-icon="filter">Filters</button>
        <button data-action="bookmarks" data-icon="bookmark">Bookmarks</button>
        <button data-action="theme" data-icon="report">Theme</button>
        <button data-action="arrange" data-icon="arrange">Arrange</button>
      </div>
      <div class="spacer"></div>
      <button
        data-action="panes"
        data-icon="panes"
        title="Toggle authoring panes"
        aria-label="Toggle authoring panes"
      ></button>
    </nav>
    <nav class="reader-tools" aria-label="Reading tools" hidden>
      <select id="focus-picker" aria-label="Focus visual"></select>
      <select id="reader-layout" aria-label="Page layout" hidden>
        <option value="auto">Automatic layout</option>
        <option value="phone">Phone layout</option>
        <option value="desktop">Desktop layout</option>
      </select>
      <button data-action="reader-filters" data-icon="filter">Filters</button>
      <button data-action="reader-reset">Reset view</button>
      <button data-action="reader-bookmarks" data-icon="bookmark">Bookmarks</button>
      <button data-action="reader-link">Get reading link</button>
    </nav>
    <section id="home" hidden>
      <div class="homeinner">
        <div class="homehead">
          <h1>Saved reports</h1>
          <div class="library-actions">
            <button class="outline" data-action="published-library">Published reports</button>
            <button class="outline" data-action="import-package">
              Import report
            </button>
            <button class="primary" data-action="new">＋ New report</button>
          </div>
        </div>
        <div id="report-cards"></div>
      </div>
    </section>
    <main>
      <nav class="rail" aria-label="Views">
        <button
          data-action="report"
          title="Report view"
          aria-label="Report view"
          data-icon="report"
        ></button
        ><button
          data-action="model"
          title="Model view"
          aria-label="Model view"
          data-icon="model"
        ></button
        ><button
          data-action="library"
          title="Library"
          aria-label="Library"
          data-icon="library"
        ></button>
      </nav>
      <section class="work">
        <div class="workhead">
          <span id="view-name"></span>
          <div class="spacer"></div>
          <span id="view-info"></span>
        </div>
        <div id="other-selections" role="group" aria-label="Selections on other visuals" hidden></div>
        <div id="viewport">
          <div id="paper-wrap"><div id="paper"></div></div>
          <div id="model"></div>
        </div>
        <div id="pages"></div>
      </section>
      <aside id="inspector"></aside>
      <aside id="data"></aside>
    </main>
    <footer>
      <span class="online"></span><span>Local workspace</span
      ><span class="footsep">/</span><span id="stats"></span>
      <div class="spacer"></div>
      <span id="zoom"></span>
    </footer>
    <input id="update-file" type="file" accept=".csv,text/csv,.parquet,.xlsx" hidden />
    <input id="package-file" type="file" accept=".keybi,.folio" hidden />
    <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
    <input id="prepare-file" type="file" accept=".csv,text/csv" hidden />
    <input id="files" type="file" accept=".csv,text/csv,.parquet,.xlsx" multiple hidden />
    <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/studio.js"></script>
  </body>
</html>
